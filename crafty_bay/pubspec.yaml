name: crafty_bay
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.1.2
  flutter_svg: ^2.2.3
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  pin_code_fields: ^9.1.0
  carousel_slider: ^5.1.2
  http: ^1.6.0
  logger: ^2.7.0
  email_validator: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
